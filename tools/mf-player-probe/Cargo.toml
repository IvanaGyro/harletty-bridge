[package]
name = "harletty-mf-player-probe"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Which Windows media stacks see a registered decoder, does the WinRT MediaPlayer play a file through it, and does a long play/seek loop leak (Phase 0 probe, Phase 3 soak)"
repository = "https://github.com/harletty/harletty-bridge"
publish = false

[[bin]]
name = "mf-player-probe"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Core",
    "Media_MediaProperties",
    "Media_Playback",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
