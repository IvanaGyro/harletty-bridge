[package]
name = "harletty-mf-decoder"
version = "0.9.0"
edition = "2024"
# Links bridge_api, like the plugins: see ../bridge.
license = "GPL-3.0-or-later"
description = "harletty-bridge as a Windows Media Foundation audio decoder, for Windows Media Player and other Media Foundation players"
repository = "https://github.com/harletty/harletty-bridge"
publish = false

# cdylib: harletty_mf.dll, registered with regsvr32. rlib: what its tests link.
[lib]
name = "harletty_mf"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The Dolby and DTS decoders are linked in (plan D10), as plugins of this
# library's own: no bridge DLL is loaded. The plugin crates themselves are not
# dependencies (their root-module exports would clash); see the dev-dependencies
# and scripts/check-crate-isolation.sh.
bridge-common = { version = "0.9.0", path = "../bridge-common" }
bridge-family-dolby = { version = "0.9.0", path = "../bridge-family-dolby" }
bridge-family-dts = { version = "0.9.0", path = "../bridge-family-dts" }
anyhow = "1"
bridge_api = { version = "0.6.0", path = "../../Omniphony/omniphony-renderer/bridge_api" }
# The renderer behind liborender, as a Rust crate: loads the bridge DLLs and
# renders objects to a speaker layout. Decoders stay in the bridge DLLs.
orender_engine = { path = "../../Omniphony/omniphony-renderer/orender_engine" }
renderer = { path = "../../Omniphony/omniphony-renderer/renderer" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"

[dev-dependencies]
# Not linked by the tests: depending on the plugin crates makes cargo build
# their cdylibs, the bridge libraries the reference session loads through
# `Engine::from_paths` (the same trick Omniphony's engine tests use).
harletty-dolby-bridge = { version = "0.9.0", path = "../plugin-dolby" }
harletty-dts-bridge = { version = "0.9.0", path = "../plugin-dts" }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
