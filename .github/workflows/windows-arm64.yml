name: Windows ARM64

# Build and test on a native Windows ARM64 runner:
#   - every pull request, whatever its base, on open and on each push to it;
#   - every push to `main` and `dev/wmp` (a merge into either).
#
# Same setup as ci.yml and release.yml: Omniphony is checked out at the ref
# `.omniphony-ref` names, libopus is built statically for the IAMF plugin, and
# the C runtime is linked statically (RUSTFLAGS replaces .cargo/config.toml,
# so +crt-static is repeated here).

on:
  push:
    branches: [main, dev/wmp]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-arm64-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The two TrueHD samples, fetched once for both Windows jobs (with retries,
  # and cached so that an outage of the sample hosts does not fail a run that
  # had them before).
  samples:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout harletty-bridge
        uses: actions/checkout@v5

      - name: Restore the cached samples
        uses: actions/cache@v5
        with:
          path: truehd-samples
          key: truehd-samples-v1

      - name: Fetch the samples
        run: scripts/fetch-truehd-samples.sh truehd-samples

      - name: Upload the samples
        uses: actions/upload-artifact@v7
        with:
          name: truehd-samples
          path: truehd-samples
          if-no-files-found: error
          retention-days: 1

  windows-arm64:
    needs: samples
    runs-on: windows-11-arm
    env:
      RUSTFLAGS: -D warnings -C target-feature=+crt-static
    steps:
      - name: Checkout harletty-bridge
        uses: actions/checkout@v5
        with:
          path: harletty-bridge

      - name: Resolve the Omniphony ref
        id: omniphony
        shell: bash
        run: echo "ref=$(harletty-bridge/scripts/omniphony-ref.sh)" >> "$GITHUB_OUTPUT"

      - name: Checkout Omniphony (path dependencies)
        uses: actions/checkout@v5
        with:
          repository: mgth/Omniphony
          ref: ${{ steps.omniphony.outputs.ref }}
          path: Omniphony

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Show toolchain host
        run: rustc -vV

      # Sets OPUS_LIB_DIR and OPUS_STATIC for the steps that follow.
      - name: Build libopus (static)
        shell: bash
        run: scripts/build-static-opus.sh
        working-directory: harletty-bridge

      - name: Build (release)
        run: cargo build --release --locked -p harletty-dolby-bridge -p harletty-dts-bridge -p harletty-iamf-bridge -p harletty
        working-directory: harletty-bridge

      - name: Test (release)
        run: cargo test --release --locked
        working-directory: harletty-bridge

      # The IAMF family is not a default member: tested on its own.
      - name: Test IAMF (release)
        run: cargo test --release --locked -p bridge-family-iamf -p harletty-iamf-bridge
        working-directory: harletty-bridge

      # Not a default member: built and tested on its own. The registration
      # test writes under HKLM, which the hosted runner may do.
      # Real TrueHD for the decoder tests: fetched once by the `samples` job,
      # never committed.
      - name: Get the TrueHD samples
        uses: actions/download-artifact@v8
        with:
          name: truehd-samples
          path: ${{ runner.temp }}/truehd

      - name: Point the tests at the TrueHD samples
        shell: bash
        run: |
          dir="$RUNNER_TEMP/truehd"
          ls -l "$dir"
          echo "HARLETTY_MF_TRUEHD_DIR=$dir" >> "$GITHUB_ENV"
          echo "HARLETTY_MF_REQUIRE_TRUEHD=1" >> "$GITHUB_ENV"
          # The soak test (plan, Phase 3 step 6) with no player: repeated
          # open/decode/seek/drop of the real track; memory and handles must stay flat.
          echo "HARLETTY_MF_SOAK_SECS=120" >> "$GITHUB_ENV"

      - name: Build and test the Media Foundation decoder (release)
        shell: bash
        env:
          HARLETTY_MF_REGISTRY_TEST: "1"
        run: |
          cargo build --release --locked -p harletty-mf-decoder -p harletty-mf-player-probe
          cargo test --release --locked -p harletty-mf-decoder -- --nocapture
        working-directory: harletty-bridge

      - name: Check the plugin libraries exist
        shell: bash
        run: |
          for f in dolby dts iamf; do
            test -f "target/release/harletty_${f}_bridge.dll"
          done
          test -f target/release/harletty_mf.dll
        working-directory: harletty-bridge

      # The archive the release builds, installed and removed again on the
      # runner (administrator, no other copy of the decoder registered).
      - name: Stage the decoder archive
        shell: bash
        run: |
          scripts/stage-mf-package.sh target/release/harletty_mf.dll stage
        working-directory: harletty-bridge

      - name: Install and uninstall from the archive
        shell: pwsh
        run: |
          Compress-Archive -Path stage/* -DestinationPath harletty-mf-ci-windows-arm64.zip
          ./scripts/test-mf-install.ps1 -Zip harletty-mf-ci-windows-arm64.zip
        working-directory: harletty-bridge

      # What a user runs: the Windows PowerShell that ships with Windows (5.1).
      - name: Install and uninstall from the archive (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          ./scripts/test-mf-install.ps1 -Zip harletty-mf-ci-windows-arm64.zip
        working-directory: harletty-bridge

      # For testing on a Windows ARM64 machine: download from the run's page.
      # Named by commit, so artifacts from different pushes do not collide.
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: harletty-windows-arm64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            harletty-bridge/target/release/harletty_dolby_bridge.dll
            harletty-bridge/target/release/harletty_dts_bridge.dll
            harletty-bridge/target/release/harletty_iamf_bridge.dll
            harletty-bridge/target/release/harletty.exe
          if-no-files-found: error
          retention-days: 30

      # The decoder for Windows Media Player and other Media Foundation
      # players: a set of its own, no bridge DLL (plan D10).
      - name: Upload the Media Foundation decoder and the probe
        uses: actions/upload-artifact@v7
        with:
          name: harletty-mf-windows-arm64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            harletty-bridge/target/release/harletty_mf.dll
            harletty-bridge/target/release/mf-player-probe.exe
            harletty-bridge/harletty-mf-ci-windows-arm64.zip
          if-no-files-found: error
          retention-days: 30

  # The same decoder on x64, where most Windows machines are. Only the
  # Media Foundation decoder: the rest is built by the ARM64 job and ci.yml.
  mf-decoder-x64:
    needs: samples
    runs-on: windows-latest
    env:
      RUSTFLAGS: -D warnings -C target-feature=+crt-static
    steps:
      - name: Checkout harletty-bridge
        uses: actions/checkout@v5
        with:
          path: harletty-bridge

      - name: Resolve the Omniphony ref
        id: omniphony
        shell: bash
        run: echo "ref=$(harletty-bridge/scripts/omniphony-ref.sh)" >> "$GITHUB_OUTPUT"

      - name: Checkout Omniphony (path dependencies)
        uses: actions/checkout@v5
        with:
          repository: mgth/Omniphony
          ref: ${{ steps.omniphony.outputs.ref }}
          path: Omniphony

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Real TrueHD for the decoder tests: fetched once by the `samples` job,
      # never committed.
      - name: Get the TrueHD samples
        uses: actions/download-artifact@v8
        with:
          name: truehd-samples
          path: ${{ runner.temp }}/truehd

      - name: Point the tests at the TrueHD samples
        shell: bash
        run: |
          dir="$RUNNER_TEMP/truehd"
          ls -l "$dir"
          echo "HARLETTY_MF_TRUEHD_DIR=$dir" >> "$GITHUB_ENV"
          echo "HARLETTY_MF_REQUIRE_TRUEHD=1" >> "$GITHUB_ENV"
          # The soak test (plan, Phase 3 step 6) with no player: repeated
          # open/decode/seek/drop of the real track; memory and handles must stay flat.
          echo "HARLETTY_MF_SOAK_SECS=120" >> "$GITHUB_ENV"

      - name: Build and test the Media Foundation decoder (release)
        shell: bash
        env:
          HARLETTY_MF_REGISTRY_TEST: "1"
        run: |
          cargo build --release --locked -p harletty-mf-decoder -p harletty-mf-player-probe
          cargo test --release --locked -p harletty-mf-decoder -- --nocapture
        working-directory: harletty-bridge

      # The archive the release builds, installed and removed again on the
      # runner (administrator, no other copy of the decoder registered).
      - name: Stage the decoder archive
        shell: bash
        run: |
          scripts/stage-mf-package.sh target/release/harletty_mf.dll stage
        working-directory: harletty-bridge

      - name: Install and uninstall from the archive
        shell: pwsh
        run: |
          Compress-Archive -Path stage/* -DestinationPath harletty-mf-ci-windows-x64.zip
          ./scripts/test-mf-install.ps1 -Zip harletty-mf-ci-windows-x64.zip
        working-directory: harletty-bridge

      # What a user runs: the Windows PowerShell that ships with Windows (5.1).
      - name: Install and uninstall from the archive (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          ./scripts/test-mf-install.ps1 -Zip harletty-mf-ci-windows-x64.zip
        working-directory: harletty-bridge

      # The decoder is one file: the Dolby and DTS decoders are linked in (plan
      # D10). The probe plays a file through MediaPlayer, for the soak test and
      # the check that no bridge DLL is loaded.
      - name: Upload the decoder and the probe
        uses: actions/upload-artifact@v7
        with:
          name: harletty-mf-windows-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            harletty-bridge/target/release/harletty_mf.dll
            harletty-bridge/target/release/mf-player-probe.exe
            harletty-bridge/harletty-mf-ci-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
